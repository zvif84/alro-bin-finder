name: Email-in bin update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-email:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Check inbox for new data file
        id: mail
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALLOWED_SENDERS: ${{ secrets.ALLOWED_SENDERS }}
        run: python fetch_email.py

      - name: Staleness guard (fail loudly if reports stop arriving)
        if: steps.mail.outputs.updated != 'true' && github.event_name == 'schedule'
        env:
          STALE_ALERT_HOURS: ${{ vars.STALE_ALERT_HOURS }}
        run: |
          # Only alert on weekdays 8am-8pm ET; quiet nights and weekends.
          DOW=$(TZ=America/New_York date +%u)   # 1=Mon .. 7=Sun
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$DOW" -ge 6 ]; then echo "Weekend: staleness guard off."; exit 0; fi
          if [ "$HOUR" -lt 8 ] || [ "$HOUR" -ge 20 ]; then echo "Outside 8am-8pm ET: staleness guard off."; exit 0; fi
          if [ ! -f LAST_SYNC ]; then echo "No baseline yet (LAST_SYNC missing): guard off until first ingest."; exit 0; fi
          LAST=$(cat LAST_SYNC)
          NOW=$(date +%s)
          AGE_MIN=$(( (NOW - LAST) / 60 ))
          THRESH_MIN=$(( ${STALE_ALERT_HOURS:-3} * 60 ))
          echo "Last successful data ingest: ${AGE_MIN} min ago (alert threshold: ${THRESH_MIN} min)."
          if [ "$AGE_MIN" -gt "$THRESH_MIN" ]; then
            echo "::error::No data email processed in ${AGE_MIN} minutes. Check: DDI scheduled report still running? Sender address still in ALLOWED_SENDERS? Inbox reachable?"
            exit 1
          fi

      - name: Validate and build app with new data
        if: steps.mail.outputs.updated == 'true'
        run: python update_bins.py auto index.html

      - name: Record sync in log
        if: steps.mail.outputs.updated == 'true'
        run: |
          SENT_EPOCH="${{ steps.mail.outputs.email_sent_epoch }}"
          NOW_EPOCH=$(date +%s)
          LAG_MIN=$(( (NOW_EPOCH - SENT_EPOCH) / 60 ))
          SENT_ET=$(TZ=America/New_York date -d "@${SENT_EPOCH}" '+%Y-%m-%d %I:%M %p')
          DONE_ET=$(TZ=America/New_York date '+%Y-%m-%d %I:%M %p')
          if [ ! -f SYNC_LOG.md ]; then
            printf '# Data Sync Log\n\nEvery successful email-in update, newest first. Lag = report sent to app rebuilt.\n\n| Processed (ET) | Report sent (ET) | Lag | File | From |\n|---|---|---|---|---|\n' > SYNC_LOG.md
          fi
          NEW_ROW="| ${DONE_ET} | ${SENT_ET} | ${LAG_MIN} min | ${{ steps.mail.outputs.email_file }} | ${{ steps.mail.outputs.email_from }} |"
          awk -v row="$NEW_ROW" 'BEGIN{done=0} {print} /^\|---\|/ && !done {print row; done=1}' SYNC_LOG.md > SYNC_LOG.tmp && mv SYNC_LOG.tmp SYNC_LOG.md
          echo "${NOW_EPOCH}" > LAST_SYNC
          echo "Logged: ${NEW_ROW}"

      - name: Commit new data file to repo
        if: steps.mail.outputs.updated == 'true'
        run: |
          git config user.name "bin-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Data update: ${{ steps.mail.outputs.email_file }} from ${{ steps.mail.outputs.email_from }}" || echo "Data identical to current, still redeploying"
          git push

      - name: Prepare site folder
        if: steps.mail.outputs.updated == 'true'
        run: mkdir site && cp index.html site/

      - name: Upload site
        if: steps.mail.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.mail.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
