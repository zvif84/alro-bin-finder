<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15181e">
<title>Alro Bin Finder — WH02 · WH05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15181e; --panel:#1e232c; --panel-2:#252b36; --edge:#333b49;
    --text:#eef1f5; --muted:#8f98a8;
    --placard:#ffc400; --placard-ink:#141414;
    --copper:#d2793f; --danger:#ff6b5e; --good:#4cc98a;
    --disp:'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body:'Barlow', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{margin:0; background:var(--ink); color:var(--text); font-family:var(--body); min-height:100vh}
  button{font-family:inherit}

  .wrap{max-width:640px; margin:0 auto; padding:0 14px 90px}
  @media (min-width:900px){ .wrap{max-width:760px} }

  header{padding:14px 0 10px; display:flex; align-items:center; gap:10px}
  .logo{background:var(--placard); color:var(--placard-ink); font-family:var(--disp); font-weight:700;
    font-size:1.25rem; letter-spacing:.04em; padding:3px 10px 4px; border-radius:4px; text-transform:uppercase}
  .hd-sub{font-family:var(--disp); font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-size:.85rem}
  .hd-sub b{color:var(--text)}

  /* Mode tabs */
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 12px}
  .tab{appearance:none; border:1.5px solid var(--edge); background:var(--panel); color:var(--muted);
    font-family:var(--disp); font-weight:700; font-size:1.15rem; letter-spacing:.08em; text-transform:uppercase;
    padding:13px 8px; border-radius:10px; cursor:pointer; transition:background .12s,color .12s,border-color .12s}
  .tab.on{background:var(--placard); color:var(--placard-ink); border-color:var(--placard)}
  .tab:focus-visible{outline:3px solid #fff; outline-offset:2px}

  /* Search */
  .searchbox{position:relative}
  #q{width:100%; background:var(--panel); border:1.5px solid var(--edge); border-radius:12px;
    color:var(--text); font-size:1.35rem; font-family:var(--body); font-weight:500;
    padding:16px 52px 16px 16px; outline:none}
  #q:focus{border-color:var(--placard)}
  #q::placeholder{color:#5d6675; font-weight:400}
  .clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:38px; height:38px;
    border-radius:50%; border:none; background:var(--panel-2); color:var(--muted); font-size:1.3rem;
    cursor:pointer; display:none; line-height:1}
  .clear.show{display:block}

  .hint{color:var(--muted); font-size:.9rem; margin:10px 2px 0}
  .hint b{color:var(--text)}
  .switch-hint{display:inline-block; margin-top:8px; background:var(--panel-2); border:1px solid var(--edge);
    color:var(--placard); border-radius:8px; padding:8px 12px; font-size:.95rem; cursor:pointer}

  .count{margin:14px 2px 8px; font-family:var(--disp); font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; font-size:.9rem; color:var(--muted)}
  .count b{color:var(--text)}

  /* Part result card */
  .card{background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:12px 12px 12px 14px;
    margin-bottom:8px; display:flex; gap:12px; align-items:center; justify-content:space-between}
  .card .info{min-width:0; flex:1}
  .desc{font-size:1.05rem; font-weight:600; line-height:1.25; margin-bottom:6px; overflow-wrap:break-word}
  .meta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:.85rem}
  .pn{font-family:var(--mono); color:var(--text); background:var(--panel-2); border-radius:5px; padding:2px 7px}
  .chip{color:var(--copper); border:1px solid rgba(210,121,63,.45); border-radius:5px; padding:1px 7px;
    font-family:var(--disp); font-weight:600; letter-spacing:.08em; font-size:.8rem; text-transform:uppercase}

  /* Stock strip */
  .stock{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:7px; font-size:.82rem}
  .pill{font-family:var(--disp); font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    font-size:.72rem; border-radius:5px; padding:2px 8px 3px}
  .pill.ok{background:rgba(76,201,138,.14); color:var(--good)}
  .pill.low{background:rgba(255,196,0,.14); color:var(--placard)}
  .pill.out{background:rgba(255,107,94,.16); color:var(--danger)}
  .qty{color:#fff; font-weight:700}
  .mm{color:var(--muted)}

  /* The bin placard — tap it to see the whole bin */
  .placard{flex-shrink:0; background:var(--placard); color:var(--placard-ink); border:none; border-radius:8px;
    padding:9px 12px 10px; text-align:center; cursor:pointer; min-width:92px;
    box-shadow:0 2px 0 #b38800; font-family:var(--disp)}
  .placard:active{transform:translateY(1px); box-shadow:0 1px 0 #b38800}
  .placard .aisle{display:block; font-weight:700; font-size:1.5rem; letter-spacing:.05em; line-height:1}
  .placard .sub{display:block; font-weight:600; font-size:.68rem; letter-spacing:.14em; margin-top:3px; opacity:.75; text-transform:uppercase}
  .placards{display:flex; flex-direction:column; gap:6px; flex-shrink:0}
  .placard.p5{background:#39445a; color:#dbe4f2; box-shadow:0 2px 0 #242c3d; padding:9px 12px 10px}
  .placard.p5 .aisle{font-size:1.5rem}
  .placard.p5 .sub{opacity:.85; font-size:.72rem}
  .placard.none{background:var(--panel-2); color:var(--muted); border:1.5px dashed var(--edge); box-shadow:none; cursor:default}
  .placard.none .aisle{font-size:1.05rem; padding:4px 0}

  /* Bin view */
  .binhead{display:flex; align-items:center; gap:12px; margin:18px 0 8px}
  .binhead .placard{cursor:default}
  .binhead .n{color:var(--muted); font-size:.95rem}
  .binrow{background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:10px 12px; margin-bottom:6px}
  .binrow .desc{margin-bottom:4px; font-size:1rem}

  .empty{margin:34px 8px; text-align:center; color:var(--muted); font-size:1rem; line-height:1.6}
  .empty .big{font-family:var(--disp); font-weight:700; font-size:1.4rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text); display:block; margin-bottom:6px}
  .warn{color:var(--danger)}

  footer{position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent, var(--ink) 30%);
    padding:18px 14px 10px; text-align:center; pointer-events:none; display:flex; flex-direction:column; gap:2px}
  #ft-main{color:#5d6675; font-size:.75rem; letter-spacing:.05em}
  #ft-credit{color:#454e5c; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; font-family:var(--disp); font-weight:600}

  @media (min-width:520px){ .placard{min-width:110px} .placard .aisle{font-size:1.7rem} .placard.p5 .aisle{font-size:1.7rem} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">Alro</span>
    <span class="hd-sub"><b>Bin Finder</b> · WH02 &middot; WH05</span>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tab-part" role="tab" aria-selected="true" onclick="setMode('part')">Find a Part</button>
    <button class="tab" id="tab-bin" role="tab" aria-selected="false" onclick="setMode('bin')">What's in a Bin</button>
  </div>

  <div class="searchbox">
    <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="characters"
      spellcheck="false" enterkeyhint="search" placeholder="Part #, description, or keywords…" aria-label="Search">
    <button class="clear" id="clearBtn" aria-label="Clear search" onclick="clearQ()">&times;</button>
  </div>
  <div id="out"></div>
</div>

<footer id="ft"><span id="ft-main"></span><span id="ft-credit">Built by R3ND3R</span></footer>

  hay: (r[0]+'|'+r[1]+'|'+r[2]+'|'+r[3]).toUpperCase()
}));
ROWS.forEach(r => { r.hayW = ' ' + r.hay.replace(/[^A-Z0-9]+/g,' ') + ' '; });
// Bin index spans both warehouses; each entry remembers which warehouse the bin lives in
const BIN_INDEX = {};
ROWS.forEach(r => {
  if(r.bin){ (BIN_INDEX[r.bin] = BIN_INDEX[r.bin]||{wh:'WH02', items:[]}).items.push(r); }
  if(r.bin5){ (BIN_INDEX[r.bin5] = BIN_INDEX[r.bin5]||{wh:'WH05', items:[]}).items.push(r); }
});
function roomOf(bin, wh){
  const c = bin.charAt(0);
  if(wh==='WH02') return c==='C' ? 'Room C' : 'Zone';
  return c==='A' ? 'Room A' : (c==='D' ? 'Room D' : 'Overstock');
}
const TOTAL = ROWS.length;
const CAP = 60;

// A query token matches a row if the token itself is a substring (original behavior),
// or if any synonym of it appears. Short synonyms (3 chars or less) must match as
// whole words so "stainless"->SS can't false-match BRASS or PRESS.
function tokenVariants(t){
  const vars = new Set();
  if(SYN[t]) SYN[t].forEach(v => vars.add(v));
  if(t.length >= 3){
    for(const key in SYN){
      if(key.length > t.length && key.indexOf(t) === 0){ SYN[key].forEach(v => vars.add(v)); }
    }
  }
  vars.delete(t);
  return [...vars];
}
function tokenMatches(r, t, vars){
  if(r.hay.indexOf(t) !== -1) return true;
  for(const v of vars){
    if(v.length <= 3){ if(r.hayW.indexOf(' '+v+' ') !== -1) return true; }
    else { if(r.hay.indexOf(v) !== -1) return true; }
  }
  return false;
}

let mode = 'part';
const $q = document.getElementById('q');
const $out = document.getElementById('out');

function setMode(m, keepQuery){
  mode = m;
  document.getElementById('tab-part').classList.toggle('on', m==='part');
  document.getElementById('tab-bin').classList.toggle('on', m==='bin');
  document.getElementById('tab-part').setAttribute('aria-selected', m==='part');
  document.getElementById('tab-bin').setAttribute('aria-selected', m==='bin');
  $q.placeholder = m==='part' ? 'Part #, description, or keywords…' : 'Bin — e.g. C08-24 or 04-COP…';
  if(!keepQuery){ $q.value=''; }
  $q.focus();
  render();
}
function clearQ(){ $q.value=''; $q.focus(); render(); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function goBin(bin){ setMode('bin', true); $q.value = bin; render(); $q.blur(); }

function placard(bin, clickable, sub){
  if(!bin) return '<div class="placard none"><span class="aisle">No bin</span><span class="sub">Ask supervisor</span></div>';
  const tag = clickable ? 'button' : 'div';
  const on = clickable ? ' onclick="goBin(\''+esc(bin).replace(/'/g,"\\'")+'\')" title="Show everything in '+esc(bin)+'"' : '';
  return '<'+tag+' class="placard"'+on+'><span class="aisle">'+esc(bin)+'</span><span class="sub">'+(sub||'WH02')+'</span></'+tag+'>';
}
function placard5(r){
  if(!r.bin5) return '';
  const qty = r.shelf5 === '' ? '' : ' &middot; '+fmtN(r.shelf5)+' on hand';
  return '<button class="placard p5" onclick="goBin(\''+esc(r.bin5).replace(/'/g,"\\'")+'\')" title="Show everything in '+esc(r.bin5)+'">'
    + '<span class="aisle">'+esc(r.bin5)+'</span><span class="sub">WH05'+qty+'</span></button>';
}

function fmtN(v){ return v==='' ? '' : Number(v).toLocaleString(); }
function stockHTML(r){
  if(r.shelf === '') return '';
  const n = Number(r.shelf);
  const mn = r.min === '' ? null : Number(r.min);
  let cls = 'ok', label = 'In stock';
  if(n <= 0){ cls = 'out'; label = 'Out'; }
  else if(mn !== null && n < mn){ cls = 'low'; label = 'Low'; }
  return '<div class="stock"><span class="pill '+cls+'">'+label+'</span>'
    + (r.min !== '' ? '<span class="mm">min '+fmtN(r.min)+(r.max !== '' ? ' &middot; max '+fmtN(r.max) : '')+'</span>' : '')
    + '</div>';
}
function qtyHTML(r){
  return r.shelf === '' ? '' : '<span class="qty">'+fmtN(r.shelf)+' on shelf</span>';
}

function partCard(r){
  return '<div class="card"><div class="info">'
    + '<div class="desc">'+esc(r.desc)+'</div>'
    + '<div class="meta"><span class="pn">'+esc(r.part)+'</span>'
    + '<span class="chip">'+esc(r.line)+'</span></div>'
    + stockHTML(r)
    + '</div><div class="placards">' + placard(r.bin, true, w2sub(r)) + placard5(r) + '</div></div>';
}
function w2sub(r){
  return r.shelf === '' ? 'WH02' : 'WH02 &middot; '+fmtN(r.shelf)+' on shelf';
}

function searchParts(qRaw){
  const q = qRaw.toUpperCase().replace(/\s+/g,' ').trim();
  const tokens = q.split(' ').filter(Boolean);
  if(!tokens.length) return [];
  const tokVars = tokens.map(t => tokenVariants(t));
  const hits = [];
  for(const r of ROWS){
    let ok = true;
    for(let i=0; i<tokens.length; i++){
      if(!tokenMatches(r, tokens[i], tokVars[i])){ ok=false; break; }
    }
    if(ok) hits.push(r);
  }
  // Exact part match floats to top
  hits.sort((a,b)=>{
    const ax = a.part===q ? 0 : 1;
    const bx = b.part===q ? 0 : 1;
    return ax - bx;
  });
  return hits;
}

function render(){
  const raw = $q.value;
  document.getElementById('clearBtn').classList.toggle('show', raw.length>0);
  const q = raw.trim();

  if(!q){
    $out.innerHTML = '<div class="hint">'+ (mode==='part'
      ? 'Type any piece of a part number or description &mdash; e.g. <b>3/4 black nipple</b>, <b>P5770</b>, <b>galv tee</b>. Abbreviations and full words both work. Scanners work too.'
      : 'Type a bin from either warehouse &mdash; e.g. <b>C08-24A</b> (WH02) or <b>A01-01</b> (WH05). Partial codes show the whole bay.') +'</div>';
    return;
  }

  if(mode==='part'){
    const hits = searchParts(q);
    if(!hits.length){
      const binish = /^[A-Z]\d{2}(-\d{0,2}[A-Z]{0,2})?$/i.test(q);
      $out.innerHTML = '<div class="empty"><span class="big">No parts found</span>'
        + 'Check the spelling, or try fewer words.<br>Searching '+TOTAL.toLocaleString()+' parts.'
        + (binish ? '<br><button class="switch-hint" onclick="goBin(\''+esc(q.toUpperCase())+'\')">&#8618; That looks like a bin &mdash; see what\'s in '+esc(q.toUpperCase())+'</button>' : '')
        + '</div>';
      return;
    }
    const shown = hits.slice(0, CAP);
    let html = '<div class="count"><b>'+hits.length.toLocaleString()+'</b> match'+(hits.length===1?'':'es')
      + (hits.length>CAP ? ' &mdash; showing first '+CAP+'. Keep typing to narrow.' : '') + '</div>';
    html += shown.map(partCard).join('');
    $out.innerHTML = html;
  } else {
    const bq = q.toUpperCase().replace(/\s+/g,'');
    const bins = Object.keys(BIN_INDEX).filter(b => b.replace(/\s+/g,'').indexOf(bq)===0).sort();
    if(!bins.length){
      $out.innerHTML = '<div class="empty"><span class="big">No bin starts with &ldquo;'+esc(bq)+'&rdquo;</span>'
        +'WH02 bins look like <b>C08-24A</b>, WH05 like <b>A01-01AL</b>, plus zone codes like <b>04-COP</b>.</div>';
      return;
    }
    let html = '', shownBins = bins.slice(0, 12);
    if(bins.length > shownBins.length){
      html += '<div class="count"><b>'+bins.length+'</b> bins match &mdash; showing first '+shownBins.length+'. Keep typing.</div>';
    }
    for(const b of shownBins){
      const entry = BIN_INDEX[b];
      const items = entry.items.slice().sort((a,c)=> a.desc<c.desc?-1:1);
      const isW5 = entry.wh === 'WH05';
      html += '<div class="binhead">'
        + (isW5 ? '<div class="placard p5"><span class="aisle">'+esc(b)+'</span><span class="sub">WH05</span></div>'
                : placard(b, false, 'WH02'))
        + '<span class="n"><b>'+items.length+'</b> part'+(items.length===1?'':'s')
        + ' &middot; '+entry.wh+' &middot; '+roomOf(b, entry.wh)+'</span></div>';
      html += items.map(r => '<div class="binrow"><div class="desc">'+esc(r.desc)+'</div>'
        + '<div class="meta"><span class="pn">'+esc(r.part)+'</span>'
        + '<span class="chip">'+esc(r.line)+'</span>'
        + (isW5 ? (r.shelf5!=='' ? '<span class="qty">'+fmtN(r.shelf5)+' on hand</span>' : '') : qtyHTML(r)) + '</div>'
        + (isW5 ? '' : stockHTML(r)) + '</div>').join('');
    }
    $out.innerHTML = html;
  }
}

let deb;
$q.addEventListener('input', ()=>{ clearTimeout(deb); deb = setTimeout(render, 80); });
$q.addEventListener('keydown', e=>{ if(e.key==='Enter'){ render(); $q.blur(); } }); // hides keyboard; scanner-friendly
document.getElementById('ft-main').textContent = TOTAL.toLocaleString()+' parts · updated '+BUILT+' · works offline once loaded';
render();
$q.focus();
</script>
</body>
</html>
